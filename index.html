function jsonpRequest(url, params, onSuccess) {
    if (!url || url.indexOf("PASTE_YOUR") === 0)
        return; // 未設定なら何もしない
    try {
        const cbName = "jsonp_cb_" + Math.random().toString(36).slice(2);
        const cleanup = () => {
            try {
                delete window[cbName];
            }
            catch (e) { }
            if (script.parentNode)
                script.parentNode.removeChild(script);
        };
        window[cbName] = (data) => {
            onSuccess(data);
            cleanup();
        };
        const query = Object.keys(params)
            .map((k) => encodeURIComponent(k) + "=" + encodeURIComponent(params[k]))
            .concat("callback=" + cbName)
            .join("&");
        const script = document.createElement("script");
        script.src = url + "?" + query;
        script.onerror = cleanup;
        document.body.appendChild(script);
    }
    catch (e) {
        // 集計に失敗しても診断自体には影響させない
    }
}

function calcResult(answers) {

    if (s.out - s.diy >= 2)
        method = "gaichu";
    else if (s.diy - s.out >= 3)
        method = "jisaku";
    else
        method = "template";

    if (s.free >= s.shihan && s.free > s.orig)
        bgm = "free";
    if (s.orig > s.shihan && s.orig > s.free)
        bgm = "orig";
    if (s.shihan >= s.free && s.shihan >= s.orig)
        bgm = "shihan";

    const showMuse = method === "gaichu" || bgm === "orig";
    // テンプレ自作 かつ Museの対象にならない人にだけ、他社ツールを案内
    const showAtelier = method === "template" && !showMuse;
    // 完全自作タイプには、編集ツール（Canva・CapCut）を案内
    const showJisakuTools = method === "jisaku" && !showMuse;
    const musePitch = bgm === "orig" ? "orig" : bgm === "shihan" ? "shihan" : "free";
