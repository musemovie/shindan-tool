function jsonpRequest(url, params, onSuccess) {
    if (!url || url.indexOf("PASTE_YOUR") === 0)
        return; // 未設定なら何もしない
    try {
        const cbName = "jsonp_cb_" + Math.random().toString(36).slice(2);
        const cleanup = () => {
            try {
                delete window[cbName];
            }
            catch (e) { }
            if (script.parentNode)
                script.parentNode.removeChild(script);
        };
        window[cbName] = (data) => {
            onSuccess(data);
            cleanup();
        };
        const query = Object.keys(params)
            .map((k) => encodeURIComponent(k) + "=" + encodeURIComponent(params[k]))
            .concat("callback=" + cbName)
            .join("&");
        const script = document.createElement("script");
        script.src = url + "?" + query;
        script.onerror = cleanup;
        document.body.appendChild(script);
    }
    catch (e) {
        // 集計に失敗しても診断自体には影響させない
    }
}

function calcResult(answers) {
    const s = { diy: 0, out: 0, free: 0, shihan: 0, orig: 0 };
    answers.forEach((a) => {
        Object.entries(a.pts).forEach(([k, v]) => (s[k] += v));
    });
    let method;
    if (s.out - s.diy >= 2)
        method = "gaichu";
    else if (s.diy - s.out >= 3)
        method = "jisaku";
    else
        method = "template";
    let bgm = "shihan";
    if (s.free >= s.shihan && s.free > s.orig)
        bgm = "free";
    if (s.orig > s.shihan && s.orig > s.free)
        bgm = "orig";
    if (s.shihan >= s.free && s.shihan >= s.orig)
        bgm = "shihan";
    // Muse Movie は「外注」全般（市販曲・オリジナル問わず）と、
    // オリジナル曲を望む全タイプ（自作・テンプレでも作曲だけ依頼できるため）が対象
    const showMuse = method === "gaichu" || bgm === "orig";

    const showAtelier = method === "template" && !showMuse;
    // 完全自作タイプには、編集ツール（Canva・CapCut）を案内
    const showJisakuTools = method === "jisaku" && !showMuse;

}

// ───────────── styles ─────────────
const INK = "#34251F"; // テキストカラー
const CREAM = "#EBE9EA"; // ベースカラー
const GOLD = "#D5BDAE"; // アクセントカラー
const BLUSH = "#DCD5D2"; // ベースとアクセントの中間トーン(境界線用)
const WHITE = "#F8F7F6"; // カード面(ベースより少し明るいトーン)
const css = `
@import url('https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap');

.fadeIn { animation: fi .45s ease both; }
.fadeOut { animation: fo .22s ease both; }
@keyframes fi { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
@keyframes fo { from { opacity: 1; } to { opacity: 0; transform: translateY(-6px); } }
@media (prefers-reduced-motion: reduce) {
  .fadeIn, .fadeOut { animation: none; }
}

/* 日本語テキストの改行を読みやすく(単語の途中や句読点直後での不自然な改行を防止) */
p, h1, h2, h3, span, button, li {
  word-break: normal;
  overflow-wrap: break-word;
  line-break: strict;
}

/* スマホでの操作感向上 */
button {
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
  -webkit-user-select: none;
  user-select: none;
}

/* 診断でわかることリストのチェックマーク */
.knowItem::before {
  content: "✓";
  position: absolute;
  left: 0;
  top: 0;
  color: ${GOLD};
  font-weight: 700;
  font-size: 12px;
}

/* オリジナルBGM体験カード */
.expItem::before {
  content: "・";
  position: absolute;
  left: 2px;
  top: 0;
  color: ${GOLD};
  font-weight: 700;
