function calcResult(answers) {
    const s = { diy: 0, out: 0, free: 0, shihan: 0, orig: 0 };
    answers.forEach((a) => {
        Object.entries(a.pts).forEach(([k, v]) => (s[k] += v));
    });
    let method;
    if (s.out - s.diy >= 2)
        method = "gaichu";
    else if (s.diy - s.out >= 3)
        method = "jisaku";
    else
        method = "template";
    let bgm = "shihan";
    if (s.free >= s.shihan && s.free > s.orig)
        bgm = "free";
    if (s.orig > s.shihan && s.orig > s.free)
        bgm = "orig";
    if (s.shihan >= s.free && s.shihan >= s.orig)
        bgm = "shihan";
